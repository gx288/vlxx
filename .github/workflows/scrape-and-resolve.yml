name: Daily Video Scrape

on:
  schedule:
    - cron: '3 0 * * *'  # 7:03 AM VN time (00:03 UTC)
  workflow_dispatch:

jobs:
  scrape_and_resolve:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download credentials
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_CREDENTIALS" > credentials.json

    - name: Run Integrated Scraper Pipeline (Metadata + Stream Links)
      run: python scripts/github_scrape_all.py

    - name: Commit and push updated database
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.txt data/vlxx_database.json data/vlxx_database.js
        git commit -m "Daily update: Metadata & Stream links $(date +%Y-%m-%d)" || echo "No changes to commit"
        git push

    - name: Upload database artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vlxx-database
        path: |
          data/vlxx_database.json
          data/vlxx_database.js
